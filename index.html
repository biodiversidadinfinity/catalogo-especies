<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Biodiversidad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 18px;
      line-height: 1.6;
      color: #222;
    }
    h1 { color: #28613a; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 12px 0 20px;
      font-size: 16px;
    }
    li { margin-bottom: 8px; }
    a { color: #1769aa; }
    #estado { color: #555; }
  </style>
</head>
<body>
  <h1>Catálogo de Biodiversidad</h1>
  <p>Índice de especies y enlaces a mis blogs.</p>

  <label for="busqueda">Buscar por nombre vulgar o científico:</label>
  <input id="busqueda" type="search"
         placeholder="Escribí el nombre de una especie">

  <h2>Lista de reptiles por nombre científico</h2>
<ul id="lista"></ul>

<h2>Lista de reptiles por nombre vulgar</h2>
<ul id="listaVulgares"></ul>

<p id="estado">Cargando especies...</p>

  
<script>
  const archivo = "https://raw.githubusercontent.com/biodiversidadinfinity/catalogo-especies/main/Reptiles%20kon%20enlases.txt";
const archivoVulgares = "https://raw.githubusercontent.com/biodiversidadinfinity/catalogo-especies/main/reptiles-vulgares.html";
  const lista = document.getElementById("lista");
  const listaVulgares = document.getElementById("listaVulgares");
  const estado = document.getElementById("estado");
  const busqueda = document.getElementById("busqueda");

  let especies = [];
let especiesVulgares = [];
  fetch(archivo)
    .then(respuesta => {
      if (!respuesta.ok) {
        throw new Error("No se pudo abrir el archivo.");
      }
      return respuesta.text();
    })
    .then(texto => {
      const documento = new DOMParser().parseFromString(
        texto, "text/html"
      );

      const enlaces = documento.querySelectorAll("a[href]");
      const vistos = new Set();

      enlaces.forEach(enlace => {
        const cientifico = enlace.textContent
          .trim().replace(/\s+/g, " ");
        const url = enlace.href;
        const parrafo = enlace.closest("p");

        if (!cientifico || !parrafo || vistos.has(url)) return;

        if (!/^https?:$/.test(new URL(url).protocol)) return;

        vistos.add(url);

        const textoCompleto = parrafo.textContent
          .replace(/\u00a0/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        const vulgar = textoCompleto
          .replace(cientifico, "")
          .replace(/[()[\]]/g, "")
          .trim();

        especies.push({
          cientifico,
          vulgar: vulgar || "Sin datos",
          url
        });
      });

      mostrarEspecies();
    })
    .catch(error => {
      estado.textContent =
        "No se pudieron cargar las especies. Revisaremos el archivo.";
      console.error(error);
    });

    fetch(archivoVulgares)
    .then(respuesta => {
      if (!respuesta.ok) {
        throw new Error("No se pudo abrir la lista de nombres vulgares.");
      }
    return respuesta.arrayBuffer();
    })
      .then(datos => new TextDecoder("utf-8").decode(datos))
    .then(texto => {
      const documentoVulgares = new DOMParser().parseFromString(
        texto, "text/html"
      );

       

     documentoVulgares.querySelectorAll("p").forEach(parrafo => {
  parrafo.querySelectorAll("a[href]").forEach(enlace => {
    const cientifico = enlace.textContent
      .replace(/\s+/g, " ")
      .trim();

    if (!cientifico) return;

    // Toma solamente el nombre vulgar que precede al enlace.
    const antesDelEnlace = enlace.previousSibling;
    if (!antesDelEnlace || antesDelEnlace.nodeType !== Node.TEXT_NODE) return;

    const vulgar = antesDelEnlace.textContent
      .replace(/[()[\]]/g, "")
      .replace(/\s+/g, " ")
      .trim();

    if (!vulgar) return;

    especiesVulgares.push({
      vulgar,
      cientifico,
      url: enlace.href
    });
  });
});
      mostrarVulgares();


    })
  
    .catch(error => {
      console.error(error);
    });
  function crearEnlace(especie, texto) {
    const enlace = document.createElement("a");
    enlace.href = especie.url;
    enlace.textContent = texto;
    enlace.target = "_blank";
    enlace.rel = "noopener noreferrer";
    return enlace;
  }

  function mostrarEspecies() {
    const termino = busqueda.value.toLowerCase().trim();

    const resultados = especies.filter(especie =>
      especie.cientifico.toLowerCase().includes(termino) ||
      especie.vulgar.toLowerCase().includes(termino)
    );

    lista.replaceChildren();
    listaVulgares.replaceChildren();

    [...resultados]
      .sort((a, b) =>
        a.cientifico.localeCompare(b.cientifico)
      )
      .forEach(especie => {
        const item = document.createElement("li");
        item.append(
          document.createTextNode(especie.vulgar + " ("),
          crearEnlace(especie, especie.cientifico),
          document.createTextNode(")")
        );
        lista.appendChild(item);
      });

 

    estado.textContent =
      "Especies encontradas: " + resultados.length;
  }
function mostrarVulgares() {
  const termino = busqueda.value.toLowerCase().trim();

  const resultados = especiesVulgares.filter(especie =>
    especie.vulgar.toLowerCase().includes(termino) ||
    especie.cientifico.toLowerCase().includes(termino)
  );

  listaVulgares.replaceChildren();

  resultados
    .sort((a, b) => a.vulgar.localeCompare(b.vulgar))
    .forEach(especie => {
      const item = document.createElement("li");

      item.append(
        document.createTextNode(especie.vulgar + " ("),
        crearEnlace(especie, especie.cientifico),
        document.createTextNode(")")
      );

      listaVulgares.appendChild(item);
    });
}
  busqueda.addEventListener("input", mostrarEspecies);
  busqueda.addEventListener("input", mostrarVulgares);
</script>

</body>
</html>
