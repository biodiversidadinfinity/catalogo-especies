<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Biodiversidad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 18px;
      line-height: 1.6;
      color: #222;
    }
    h1 { color: #28613a; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 12px 0 20px;
      font-size: 16px;
    }
    li { margin-bottom: 8px; }
    a { color: #1769aa; }
    #estado { color: #555; }
  </style>
</head>
<body>
  <h1>Catálogo de Biodiversidad</h1>
  <p>Índice de especies y enlaces a mis blogs.</p>

  <label for="busqueda">Buscar por nombre vulgar o científico:</label>
  <input id="busqueda" type="search"
         placeholder="Escribí el nombre de una especie">

  <p id="estado">Cargando especies...</p>
  <ul id="lista"></ul>

  <script>
    const archivo = "Reptiles%20enlaces.txt";
    const lista = document.getElementById("lista");
    const estado = document.getElementById("estado");
    const busqueda = document.getElementById("busqueda");
    let especies = [];

    fetch(archivo)
      .then(respuesta => {
        if (!respuesta.ok) {
          throw new Error("No se pudo abrir el archivo de especies.");
        }
        return respuesta.text();
      })
      .then(texto => {
        const documento = new DOMParser().parseFromString(
          texto, "text/html"
        );

        const enlaces = documento.querySelectorAll("a[href]");
        const vistos = new Set();

        enlaces.forEach(enlace => {
          const nombre = enlace.textContent.trim().replace(/\s+/g, " ");
          const url = enlace.href;

          if (
            nombre &&
            /^https?:$/.test(new URL(url).protocol) &&
            !vistos.has(url)
          ) {
            vistos.add(url);
            especies.push({ nombre, url });
          }
        });

        mostrarEspecies();
      })
      .catch(error => {
        estado.textContent =
          "No se pudieron cargar las especies. Revisaremos el archivo.";
        console.error(error);
      });

    function mostrarEspecies() {
      const termino = busqueda.value.toLowerCase().trim();
      const resultados = especies.filter(especie =>
        especie.nombre.toLowerCase().includes(termino)
      );

      lista.replaceChildren();

      resultados.forEach(especie => {
        const item = document.createElement("li");
        const enlace = document.createElement("a");
        enlace.href = especie.url;
        enlace.textContent = especie.nombre;
        enlace.target = "_blank";
        enlace.rel = "noopener noreferrer";
        item.appendChild(enlace);
        lista.appendChild(item);
      });

      estado.textContent = especies.length
        ? "Enlaces encontrados: " + resultados.length
        : "No se encontraron enlaces en el archivo.";
    }

    busqueda.addEventListener("input", mostrarEspecies);
  </script>
</body>
</html>
